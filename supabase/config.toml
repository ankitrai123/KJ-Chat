# Supabase CLI configuration for LOCAL development (`npx supabase start`).
# Hosted projects are configured in the dashboard; see README "Deployment".

project_id = "kj-chat"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
# Local email viewer for confirmation / reset links: http://127.0.0.1:54324
enabled = true
port = 54324

[storage]
enabled = true
# Buckets, MIME allow-lists and per-bucket limits are created by the migrations.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# token_hash links work on any device (unlike PKCE code links, which must be opened in the
# browser that signed up). The same templates should be pasted into the hosted dashboard.
[auth.email.template.confirmation]
subject = "Confirm your KJ Chat account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your KJ Chat password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You've been invited to KJ Chat"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email-change.html"
